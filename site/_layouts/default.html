<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="icon" href="{{ '/assets/icons/aphotic-favicon.svg' | relative_url }}" type="image/svg+xml">
  <meta property="og:title" content="{{ page.title }} · {{ site.title }}"><meta property="og:description" content="{{ page.description | default: site.description }}"><meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {% include header.html %}
  <main id="content">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
