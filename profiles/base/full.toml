[meta]
name = "full"
description = "Full install: today's complete package set"

[packages]
prep = ["qt5-wayland", "qt5ct", "qt6-wayland", "qt6ct", "qt5-svg", "qt5-quickcontrols2", "qt5-graphicaleffects", "gtk3", "polkit-gnome", "pipewire", "wireplumber", "jq", "curl", "wl-clipboard", "cliphist", "python-requests", "python-pillow", "pacman-contrib", "kvantum", "kvantum-qt5", "lm_sensors", "pciutils", "nvidia-utils", "radeontop", "intel-gpu-tools", "glib2", "dbus", "procps-ng", "util-linux", "gawk"]
# tumbler and the three format helpers after `thunar` are Thunar's
# thumbnailing stack, not extras: Thunar renders no thumbnails itself, it
# asks the Tumbler D-Bus service, so without tumbler installed every file
# in the file manager falls back to its generic MIME icon and a finished
# install looks half-built. Nothing in this repo references these by name
# (they are pulled in by D-Bus activation and gdk-pixbuf), so don't prune
# them as unused. ffmpegthumbnailer/poppler-glib cover video/PDF previews
# and webp-pixbuf-loader covers .webp, which gdk-pixbuf can't read alone.
main = ["kitty", "quickshell", "awww", "swaylock-effects", "hypridle", "zsh-theme-powerlevel10k-git", "zsh-autosuggestions", "oh-my-zsh-git", "zsh-syntax-highlighting", "xdg-desktop-portal-hyprland", "adw-gtk-theme", "openvpn", "papirus-folders", "bibata-cursor-theme", "swappy", "eza", "grim", "python-pyamdgpuinfo", "slurp", "thunar", "tumbler", "ffmpegthumbnailer", "poppler-glib", "webp-pixbuf-loader", "cava", "btop", "firefox", "mpv", "pamixer", "pavucontrol", "brightnessctl", "playerctl", "bluez", "bluez-utils", "blueman", "wallust-git", "matugen", "python-pywalfox", "python-pywayland", "network-manager-applet", "visual-studio-code-bin", "gvfs", "thunar-archive-plugin", "file-roller", "starship", "papirus-icon-theme", "ttf-jetbrains-mono-nerd", "ttf-material-symbols-variable", "inter-font", "noto-fonts-emoji", "lxappearance", "xfce4-settings", "nwg-look", "sddm", "greetd"]
