[meta]
name = "minimal"
description = "Bare Hyprland + Quickshell bar, no extras"

[packages]
prep = ["qt5-wayland", "qt5ct", "qt6-wayland", "qt6ct", "qt5-svg", "qt5-quickcontrols2", "qt5-graphicaleffects", "gtk3", "polkit-gnome", "pipewire", "wireplumber", "jq", "curl", "wl-clipboard", "cliphist", "python", "python-requests", "python-pillow", "pacman-contrib", "kvantum", "kvantum-qt5", "lm_sensors", "pciutils", "nvidia-utils", "radeontop", "intel-gpu-tools", "glib2", "dbus", "libnotify", "procps-ng", "util-linux", "gawk", "xdg-utils"]
# qt6-imageformats is what lets the shell decode WebP, TIFF, TGA and
# JPEG 2000; Qt reads only PNG, JPEG, GIF and SVG without it. Desktop pet
# sprite sheets are WebP wherever they come from, and an image Qt cannot
# decode fails with "Unsupported image format" and nothing else, so the
# surface using it just silently draws its fallback. In both profiles for
# the same reason a shelled-out binary is: a feature that works on full
# and quietly does nothing on minimal is worse than one that is absent.
# wallust is not in this list on purpose. No Arch repo carries it, and
# both AUR routes broke: the stable package pins a checksum against a
# codeberg archive that gets regenerated, and the -git one now builds
# 4.0.0-alpha. lib/install/wallust.sh installs the upstream static binary
# against a pinned sha256 instead, and never fails the install.
main = ["quickshell", "qt6-shadertools", "qt6-imageformats", "qt6-multimedia", "ffmpeg", "kitty", "awww", "xdg-desktop-portal-hyprland", "matugen", "openvpn", "swappy", "grim", "slurp", "wf-recorder", "brightnessctl", "swaylock-effects", "hypridle", "cava", "ttf-jetbrains-mono-nerd", "ttf-material-symbols-variable", "inter-font", "pamixer", "network-manager-applet", "networkmanager", "blueman", "papirus-icon-theme", "papirus-folders", "bibata-cursor-theme", "adw-gtk-theme", "greetd", "flatpak"]

# Flatpak applications. The bare `flatpak` binary is above in [packages]
# main; this table is what gets installed through it by lib/install/
# flatpak.sh, and every entry is optional: a failure is reported and
# skipped, never fatal.
#
# adw-gtk3-dark is the shell's default gtkTheme (Settings.qml). A Flatpak
# GTK app reads the host theme through a Gtk3theme extension, not the host
# filesystem, so without `org.gtk.Gtk3theme.adw-gtk3-dark` every Flatpak
# GTK window draws plain Adwaita while all the native ones are themed.
# In both profiles for the same reason a shelled-out binary is: a feature
# that works on full and quietly does nothing on minimal is worse than one
# that is absent.
[flatpak]
apps = ["org.gtk.Gtk3theme.adw-gtk3-dark"]
