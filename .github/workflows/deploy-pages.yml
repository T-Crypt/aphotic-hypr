name: Deploy Aphotic Pages
on:
  push:
    branches: [main]
  pull_request:
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone public Wiki
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" site/_wiki
      - name: Prepare public documentation
        run: python3 site/scripts/prepare_wiki.py --wiki site/_wiki --output site/_docs
      - uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
