backend = "fastresize"
palette = "kmeans"
# Ensures readable contrast against the background for every generated
# color, not just the fixed "on"-role text wired up in Colours.qml --
# without this, a dark/desaturated wallpaper region can produce an
# ANSI color (color8 dim-gray is the common offender) that's nearly
# invisible against the background, which is exactly what made `ls`
# output hard to read on some themes.
check_contrast = true

[templates]
# Pywal-compatible templates: single-brace {color0} syntax. Only safe for
# files with no OTHER literal `{ }` characters in them — pywal-compat mode
# treats every single `{` as a substitution token start.
cava = { template = "colors-cava", target = "~/.config/cava/config", pywal = true }
kitty = { template = "colors-kitty.conf", target = "~/.config/kitty/colors-kitty.conf", pywal = true }
swaylock = { template = "colors-swaylock", target = "~/.config/swaylock/config", pywal = true }
kvantum = { template = "Aphotic.kvconfig", target = "~/.config/Kvantum/Aphotic/Aphotic.kvconfig", pywal = true }
# VS Code theming (dlasagno.wal-theme extension, already installed +
# already set as workbench.colorTheme) reads pywal's own cache files
# directly -- ~/.cache/wal/colors (plain, 16 lines) and colors.json
# (special.background/foreground) -- and nothing in this repo ever
# wrote them, so the "Wal" theme just never had real colors to render.
# wallust itself never writes there either (it's not pywal, just
# pywal-*compatible*), hence templating both by hand here instead.
wal_colors = { template = "colors-wal-plain", target = "~/.cache/wal/colors", pywal = true }
# Plugin-facing palette snapshot -- regenerated on every wallust run
# (fixed-colorscheme theme or image-derived, doesn't matter), giving the
# plugin system (see docs/PLUGIN_SYSTEM.md) one reliable, always-fresh
# source for "the current resolved palette" without duplicating any of
# the theme-resolution logic itself.
plugin_palette = { template = "colors-plugin-palette.json", target = "~/.local/state/aphotic/palette.json" }

# Native Jinja2 templates: double-brace {{ color0 }} syntax, required for
# files that have their own literal `{ }` (Lua tables, CSS rule blocks) —
# Jinja2 only triggers on double braces, so those pass through untouched.
hyprland = { template = "colors-hyprland.lua", target = "~/.config/hypr/colors.lua" }
gtk = { template = "gtk.css", target = "~/.config/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk.css", target = "~/.config/gtk-4.0/gtk.css" }
quickshell = { template = "colors-quickshell-colours.qml", target = "~/.config/quickshell/aphotic/services/Colours.qml" }
wal_colors_json = { template = "colors-wal.json", target = "~/.cache/wal/colors.json" }
