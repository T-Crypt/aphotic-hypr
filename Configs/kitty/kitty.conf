include ./colors-kitty.conf
font_family      jetbrains mono nerd font
font_size        15
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.4
# Never restore a maximized window from the last run. kitty remembers its
# maximize state in ~/.cache/kitty/main.json, so one maximized terminal
# made every later terminal open maximized over the workspace.
remember_window_size no
