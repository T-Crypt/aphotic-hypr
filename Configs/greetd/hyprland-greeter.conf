# Aphotic greeter session -- the throwaway Hyprland instance greetd spins
# up just to host the Quickshell greeter client
# (/etc/xdg/quickshell/aphotic-greeter/, deployed from
# Configs/greetd/greeter/). Deliberately a plain, native hyprlang config,
# NOT this repo's own Configs/hypr/hyprland.lua -- that whole Lua config
# chain (colors.lua, wallust output, startup.lua's autostart list) assumes
# a real logged-in user session, and the one surface that has to render
# before anyone is authenticated must not depend on it.
#
# Deployed to /etc/greetd/aphotic/hyprland-greeter.conf by
# setup_greetd_greeter() (lib/install/config_deploy.sh); referenced from
# greetd's own /etc/greetd/config.toml only once `aphotic displaymanager
# switch greetd` writes that file (see commands/cmd_displaymanager.sh) --
# never touched automatically by install.sh.

monitor = , preferred, auto, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    drop_shadow = false

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# Runs the greeter in the foreground on purpose: Greetd.launch(...,
# quit: true)'s own teardown exits this process the moment login succeeds
# and greetd's real session hand-off begins, and `hyprctl dispatch exit`
# right behind it tears this throwaway compositor down in turn -- releasing
# the VT/DRM device before greetd starts the real session's Hyprland fresh.
# If the greeter exits for any other reason (crash, Escape-cancel loop),
# this also exits and greetd relaunches default_session.command from
# scratch, matching greetd's own documented restart behaviour.
exec-once = sh -c 'qs -c aphotic-greeter; hyprctl dispatch exit'
