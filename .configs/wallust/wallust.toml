backend = "kmeans"
color_space = "lab"
palette = "dark"

[templates]
cava = { template = "colors-cava", target = "~/.config/cava/config" }
hyprland = { template = "colors-hyprland.lua", target = "~/.config/hypr/colors.lua" }
kitty = { template = "colors-kitty.conf", target = "~/.config/kitty/colors-kitty.conf" }
mako = { template = "colors-mako", target = "~/.config/mako/config" }
rofi = { template = "colors-rofi.rasi", target = "~/.config/rofi/colors/colors-rofi.rasi" }
swaylock = { template = "colors-swaylock", target = "~/.config/swaylock/config" }
waybar = { template = "colors-waybar.css", target = "~/.config/waybar/colors-waybar.css" }
gtk = { template = "gtk.css", target = "~/.config/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk.css", target = "~/.config/gtk-4.0/gtk.css" }
kvantum = { template = "Noctis.kvconfig", target = "~/.config/Kvantum/Noctis/Noctis.kvconfig" }
