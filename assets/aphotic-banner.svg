  <!-- Terminal box -->
  <rect x="65" y="215" width="775" height="86" rx="12" fill="#111021" stroke="#2a2a45" stroke-width="1.2"/>
  <circle cx="90" cy="234" r="4.5" fill="#3f3f57"/>
  <circle cx="106" cy="234" r="4.5" fill="#3f3f57"/>
  <circle cx="122" cy="234" r="4.5" fill="#3f3f57"/>

  <text x="88" y="264" font-family="Consolas, 'Courier New', monospace" font-size="16">
