    <path d="M 214,132 L 298,132 L 256,320 Z" fill="url(#shaft)"/>
    <circle cx="308" cy="360" r="16" fill="#5eead4"/>
  </g>

  <!-- Wordmark -->
  <text x="248" y="128" font-family="Verdana, Geneva, sans-serif" font-weight="bold"
