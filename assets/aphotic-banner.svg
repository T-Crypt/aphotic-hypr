<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#2a3a6b" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#241f4a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="78%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ff62a5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff62a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ff7"/>
      <stop offset="55%" stop-color="#a06be0"/>
      <stop offset="100%" stop-color="#ff62a5"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
