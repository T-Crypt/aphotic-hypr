      <stop offset="100%" stop-color="#ff62a5"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5c8fc"/>
      <stop offset="100%" stop-color="#ff8fc0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="#0a0a16"/>
  <rect width="900" height="320" fill="url(#bgGlow)"/>
  <rect width="900" height="320" fill="url(#pinkGlow)"/>

  <circle cx="60" cy="38" r="1.6" fill="#4f8ff7" opacity="0.7"/>
  <circle cx="760" cy="45" r="1.4" fill="#ff62a5" opacity="0.6"/>
  <circle cx="820" cy="100" r="1.8" fill="#fc793c" opacity="0.55"/>
  <circle cx="838" cy="180" r="1.4" fill="#4f8ff7" opacity="0.5"/>

  <!-- Hexagon logo -->
  <g transform="translate(78,66) scale(0.155)">
    <polygon points="256,54 432,155 432,357 256,458 80,357 80,155"
