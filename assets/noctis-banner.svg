<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#14121f"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9baaff"/>
      <stop offset="1" stop-color="#d6c8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d7bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="320" fill="url(#bgGrad)"/>
  <circle cx="450" cy="110" r="220" fill="url(#glow)"/>

  <g fill="#d6c8ff" opacity="0.7">
    <circle cx="60" cy="40" r="1.4"/>
    <circle cx="120" cy="90" r="1"/>
    <circle cx="760" cy="45" r="1.2"/>
    <circle cx="820" cy="100" r="1"/>
    <circle cx="840" cy="180" r="1"/>
  </g>

  <g transform="translate(60, 66)">
    <g transform="scale(1.45)">
      <path d="M14 60 L14 74 L28 74" stroke="#6d7bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
      <path d="M74 28 L74 14 L60 14" stroke="#6d7bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
      <path d="M56 20 A26 26 0 1 0 56 68 A20 20 0 1 1 56 20 Z" fill="url(#moonGrad)"/>
    </g>
  </g>

  <text x="255" y="138" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="66" fill="url(#moonGrad)">Noctis</text>
  <text x="258" y="170" font-family="'Courier New',Consolas,monospace" font-size="14" letter-spacing="2" fill="#6a6f8a">HYPRLAND | QUICKSHELL, AFTER DARK</text>

  <!-- terminal window: the IPC grammar as a lived-in prompt -->
  <g transform="translate(60,210)">
    <rect x="0" y="0" width="780" height="86" rx="10" fill="#12141c" stroke="#232433" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#3a3c4d"/>
    <circle cx="36" cy="18" r="4.5" fill="#3a3c4d"/>
    <circle cx="52" cy="18" r="4.5" fill="#3a3c4d"/>
    <line x1="0" y1="30" x2="780" y2="30" stroke="#1e2029" stroke-width="1"/>

    <text x="20" y="52" font-family="'Courier New',Consolas,monospace" font-size="14" fill="#6d7bff">❯</text>
    <text x="38" y="52" font-family="'Courier New',Consolas,monospace" font-size="14" fill="#d6c8ff">noctis shell</text>
    <text x="150" y="52" font-family="'Courier New',Consolas,monospace" font-size="14" fill="#7a7f9c">reload</text>

    <text x="20" y="74" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#4d5170">quickshell daemon · ipc socket attached · bar / notifs / launcher</text>
  </g>
